[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-track"
version = "0.2.0"
description = "Open-source surfer detection dataset and training control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "gdown>=6.1,<7",
]

[project.optional-dependencies]
# 0.20 for transforms.v2's JPEG; the detector augmentation needs it.
train = ["pillow>=10,<13", "torch>=2.4,<3", "torchvision>=0.20,<1"]

# Without this, setuptools' flat-layout discovery also picks up the runtime `var/`
# directory and refuses to build.
[tool.setuptools.packages.find]
include = ["surf_track*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
